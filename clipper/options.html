<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WayNoted Web Clipper</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="options">
<main>
  <header class="brand">
    <img src="icons/icon-48.png" alt="" width="32" height="32">
    <h1 id="h">WayNoted Web Clipper</h1>
  </header>
  <section class="panel flow">
    <h2 id="connection-title"></h2>
    <p id="state" role="status"></p>
    <ol class="muted">
      <li id="guide-open"></li>
      <li id="guide-pair"></li>
    </ol>
    <form id="pair" class="flow">
      <div class="field">
        <label for="base" id="l-base"></label>
        <input id="base" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:12345" required>
      </div>
      <div class="field">
        <label for="code" id="l-code"></label>
        <input id="code" type="text" autocomplete="off" spellcheck="false" maxlength="12" placeholder="ABCD-EFGH" aria-describedby="code-hint" required>
        <small id="code-hint" class="muted"></small>
      </div>
      <div class="row">
        <button id="pair-btn" class="primary" type="submit"></button>
      </div>
    </form>
    <div id="connected-actions" class="row" hidden>
      <button id="test" type="button"></button>
      <button id="unpair" type="button" class="quiet"></button>
    </div>
    <p id="msg" role="status" hidden></p>
  </section>
</main>
<script src="identity.js"></script>
<script src="api.js"></script>
<script src="options.js"></script>
</body>
</html>
